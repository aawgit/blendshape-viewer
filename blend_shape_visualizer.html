<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blendshape Parser & Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Blendshape Parser & Visualizer</h1>
        
        <div class="input-section">
            <h3>Paste your blendshapes array:</h3>
            <textarea id="inputData" placeholder="[0.0, 0.0, 0.0, ...]"></textarea>
            <button onclick="parseData()">Parse & Apply Blendshapes</button>
        </div>
        
        <div id="stats" class="stats" style="display: none;">
            <div class="stat-item">
                <div class="stat-value" id="totalValues">0</div>
                <div class="stat-label">Total Values</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="activeCount">0</div>
                <div class="stat-label">Active Blendshapes</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="maxValue">0</div>
                <div class="stat-label">Max Value</div>
            </div>
        </div>
        
        <div class="main-content">
            <div class="viewer-section">
                <div id="threejs-container"></div>
            </div>
            
            <div class="controls-section">
                <div class="model-controls">
                    <h4>Model Controls</h4>
                    <div class="control-row">
                        <label>Scale:</label>
                        <input type="range" id="modelScale" min="1" max="8" step="0.1" value="4" />
                    </div>
                    <div class="control-row">
                        <label>Rotation:</label>
                        <input type="range" id="modelRotation" min="0" max="6.28" step="0.1" value="0" />
                    </div>
                </div>
                
                <!-- <div class="active-blendshapes">
                    <h4>Active Blendshapes (> 0.01)</h4>
                    <div id="activeBlendshapes">No data received</div>
                </div> -->
                
                <div class="blendshapes-panel">
                    <h3>ARKit Blendshapes</h3>
                    <div id="sliderContainer"></div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="./main.js"></script>

   
</body>
</html>
