<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>FBX Blendshape Viewer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
            color: white;
            font-family: sans-serif;
        }

        #sliderContainer {
            position: fixed;
            top: 10px;
            right: 10px;
            max-height: 90vh;
            overflow-y: auto;
            background: #222;
            padding: 10px;
            border-radius: 8px;
        }

        .slider-group {
            margin: 5px 0;
        }

        .slider-group label {
            font-size: 12px;
            display: block;
            margin-bottom: 2px;
        }
    </style>
</head>

<body>
    <div id="sliderContainer"></div>
    <script type="module">
        import * as THREE from 'https://esm.sh/three@0.160.0';
        import { FBXLoader } from 'https://esm.sh/three@0.160.0/examples/jsm/loaders/FBXLoader.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(1, 1, 1);
        scene.add(light);

        const ambientLight = new THREE.AmbientLight(0x888888);
        scene.add(ambientLight);

        camera.position.set(0, 6.5, 8);

        let meshWithMorphs = null;
        const sliders = {};

        function createSliders(dict) {
            const container = document.getElementById('sliderContainer');
            Object.entries(dict).forEach(([name, index], i) => {
                if (i >= 52) return;

                const group = document.createElement('div');
                group.className = 'slider-group';

                const label = document.createElement('label');
                label.innerText = name;

                const slider = document.createElement('input');
                slider.type = 'range';
                slider.min = 0;
                slider.max = 1;
                slider.step = 0.01;
                slider.value = 0;
                slider.oninput = () => {
                    meshWithMorphs.morphTargetInfluences[index] = parseFloat(slider.value);
                };

                sliders[name] = slider;
                group.appendChild(label);
                group.appendChild(slider);
                container.appendChild(group);
            });
        }

        function applyBlendshapeCoefficients(coefs) {
            if (!meshWithMorphs || !meshWithMorphs.morphTargetDictionary) return;
            const dict = meshWithMorphs.morphTargetDictionary;
            const influences = meshWithMorphs.morphTargetInfluences;

            Object.entries(dict).forEach(([name, index], i) => {
                if (i < 52 && index < influences.length) {
                    const val = coefs[i] || 0;
                    influences[index] = val;
                    if (sliders[name]) sliders[name].value = val;
                }
            });
        }

        const loader = new FBXLoader();
        loader.load('./metaHumanHead_52shapekeys_01.fbx', (fbx) => {
            //   fbx.rotation.y = Math.PI; // Turn the face forward
            fbx.scale.set(0.05, 0.05, 0.05);
            scene.add(fbx);

            fbx.traverse((child) => {
                if (child.isMesh && child.morphTargetInfluences) {
                    meshWithMorphs = child;
                }
                if (meshWithMorphs) {
                createSliders(meshWithMorphs.morphTargetDictionary);

                // Example test input
                const testInput = new Array(52).fill(0);
                testInput[24] = 1; // mouthOpen or similar
                applyBlendshapeCoefficients(testInput);
            } else {
                console.warn("No mesh with morph targets found in the FBX.");
            }
            });

       
        }, undefined, (err) => {
            console.error("Error loading FBX model:", err);
        });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>

</html>
